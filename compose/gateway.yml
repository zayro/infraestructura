# Entrada HTTP (Traefik). Los middlewares compartidos viven aqui, no en ningun servicio,
# para que los servicios puedan salir a sus propios repositorios.
services:
  traefik:
    image: traefik:v3.7.13
    container_name: demo-traefik
    environment:
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-key-32-chars-long}
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --experimental.plugins.jwt.modulename=github.com/agilezebra/jwt-middleware
      - --experimental.plugins.jwt.version=v1.6.0
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      # Trazas del gateway: OTLP/gRPC -> Collector -> Tempo.
      # Es independiente del exporter Prometheus de metricas.
      - --tracing=true
      - --tracing.servicename=traefik
      - --tracing.samplerate=${TRAEFIK_TRACING_SAMPLE_RATE:-1.0}
      - --tracing.otlp.grpc=true
      - --tracing.otlp.grpc.endpoint=otel-collector:4317
      - --tracing.otlp.grpc.insecure=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --ping=true
    ports:
      - "8000:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      otel-collector:
        condition: service_started
      test-fastapi-service:
        condition: service_healthy
      test-fastify-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.demo-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-10}
      - traefik.http.middlewares.demo-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.demo-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-20}
      - traefik.http.middlewares.demo-inflight.inflightreq.amount=${MAX_INFLIGHT_REQUESTS:-50}
      - traefik.http.middlewares.demo-secure-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.demo-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.demo-secure-headers.headers.browserxssfilter=true
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.X-Powered-By=
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.Server=
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-observability-net
