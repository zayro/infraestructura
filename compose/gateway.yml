# Entrada HTTP (Traefik). Los middlewares compartidos viven aqui, no en ningun servicio,
# para que los servicios puedan salir a sus propios repositorios.
services:
  traefik:
    image: traefik:v3.7.13
    container_name: demo-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --ping=true
      # Autenticacion centralizada: todo router del entrypoint `web` exige un JWT valido de Keycloak
      - --entrypoints.web.http.middlewares=demo-auth@docker
    ports:
      - "8000:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      test-fastapi-service:
        condition: service_healthy
      test-fastify-service:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.demo-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth
      - traefik.http.middlewares.demo-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Preferred-Username,X-Auth-Request-Groups
      - traefik.http.middlewares.demo-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-10}
      - traefik.http.middlewares.demo-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.demo-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-20}
      - traefik.http.middlewares.demo-inflight.inflightreq.amount=${MAX_INFLIGHT_REQUESTS:-50}
      - traefik.http.middlewares.demo-secure-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.demo-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.demo-secure-headers.headers.browserxssfilter=true
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.X-Powered-By=
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.Server=
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-observability-net
