# Definicion autonoma del servicio: se incluye desde el docker-compose.yml de la plataforma.
# Rutas relativas a esta carpeta, para poder moverla a su propio repositorio sin cambios.
services:
  student-service:
    build:
      context: .
    container_name: demo-student-service
    environment:
      SERVICE_NAME: student-service
      SERVICE_PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
    expose:
      - "8081"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.demo-student.rule=PathPrefix(`/`)'
      - traefik.http.routers.demo-student.entrypoints=web
      - traefik.http.routers.demo-student.middlewares=demo-ratelimit@docker,demo-inflight@docker,demo-secure-headers@docker
      - traefik.http.routers.demo-student.service=demo-student
      - traefik.http.services.demo-student.loadbalancer.server.port=8081
      - traefik.docker.network=demo-observability-net
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-observability-net
