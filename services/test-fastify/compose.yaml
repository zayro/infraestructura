# Definicion autonoma del servicio: se incluye desde el docker-compose.yml de la plataforma.
# Rutas relativas a esta carpeta, para poder moverla a su propio repositorio sin cambios.
services:
  test-fastify-service:
    build:
      context: .
    container_name: demo-test-fastify-service
    environment:
      SERVICE_NAME: test-fastify-service
      SERVICE_PORT: "8084"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-demo}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-demo}:${RABBITMQ_PASSWORD:-demo}@rabbitmq:5672/
      RABBITMQ_QUEUE: test.events
    expose:
      - "8084"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.demo-test-fastify.rule=PathPrefix(`/api/node`)'
      - traefik.http.routers.demo-test-fastify.entrypoints=web
      - traefik.http.routers.demo-test-fastify.middlewares=demo-ratelimit@docker,demo-inflight@docker,demo-secure-headers@docker
      - traefik.http.routers.demo-test-fastify.service=demo-test-fastify
      - traefik.http.services.demo-test-fastify.loadbalancer.server.port=8084
      - traefik.docker.network=demo-observability-net
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-observability-net
