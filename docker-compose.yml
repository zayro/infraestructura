# Punto de entrada unico: un solo proyecto, una sola red (demo-observability-net) y los mismos volumenes.
# - compose/: plataforma (datos, observabilidad, gateway), a cargo del equipo de plataforma.
# - services/*/compose.yaml: cada servicio define su propio contenedor; solo dependen de postgres,
#   redis, rabbitmq y otel-collector por nombre. Sus rutas son relativas a su propia carpeta.
include:
  - path: compose/infra.yml
    project_directory: .
  - path: compose/observability.yml
    project_directory: .
  - path: compose/gateway.yml
    project_directory: .
  - services/student/compose.yaml
  - services/test-fastapi/compose.yaml
  - services/test-fastify/compose.yaml
  # Cuando un servicio viva en su propio repositorio, sustituya su linea por la URL de Git:
  # - https://github.com/ORG/test-fastify-service.git#main:compose.yaml
