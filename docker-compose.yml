# Punto de entrada unico: un solo proyecto, una sola red (app-observability-net) y los mismos volumenes.
# - compose/: plataforma (datos, observabilidad, gateway), a cargo del equipo de plataforma.
# - services/*/compose.yaml: cada servicio define su propio contenedor; solo dependen de postgres,
#   redis, rabbitmq y otel-collector por nombre. Sus rutas son relativas a su propia carpeta.
include:
  - path: compose/infra.yml
    project_directory: .
  - path: compose/observability.yml
    project_directory: .
  - path: compose/gateway.yml
    project_directory: .
  # Servicios versionados localmente junto con la plataforma para conservar sus contratos.
  - path: services/test-fastapi/compose.yaml
    project_directory: services/test-fastapi
  - path: services/test-fastify/compose.yaml
    project_directory: services/test-fastify
