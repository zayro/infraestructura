services:
  traefik:
    image: traefik:v3.7.13
    container_name: demo-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
      - --ping=true
    ports:
      - "8000:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      student-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - demo-net

  student-service:
    build:
      context: ./services/student
    container_name: demo-student-service
    environment:
      SERVICE_NAME: student-service
      SERVICE_PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
    expose:
      - "8081"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.demo-student.rule=PathPrefix(`/`)'
      - traefik.http.routers.demo-student.entrypoints=web
      - traefik.http.routers.demo-student.middlewares=demo-ratelimit,demo-inflight,demo-secure-headers
      - traefik.http.routers.demo-student.service=demo-student
      - traefik.http.services.demo-student.loadbalancer.server.port=8081
      # Middlewares compartidos por todos los routers (referenciados como <nombre>@docker)
      - traefik.http.middlewares.demo-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-10}
      - traefik.http.middlewares.demo-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.demo-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-20}
      - traefik.http.middlewares.demo-inflight.inflightreq.amount=${MAX_INFLIGHT_REQUESTS:-50}
      - traefik.http.middlewares.demo-secure-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.demo-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.demo-secure-headers.headers.browserxssfilter=true
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.X-Powered-By=
      - traefik.http.middlewares.demo-secure-headers.headers.customresponseheaders.Server=
      - traefik.docker.network=demo-observability-net
    networks:
      - demo-net

  test-fastapi-service:
    build:
      context: ./services/test-fastapi
    container_name: demo-test-fastapi-service
    environment:
      SERVICE_NAME: test-fastapi-service
      SERVICE_PORT: "8083"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-demo}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-demo}:${RABBITMQ_PASSWORD:-demo}@rabbitmq:5672/
      RABBITMQ_QUEUE: test.events
    expose:
      - "8083"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.demo-test-fastapi.rule=PathPrefix(`/api/test`)'
      - traefik.http.routers.demo-test-fastapi.entrypoints=web
      - traefik.http.routers.demo-test-fastapi.middlewares=demo-ratelimit@docker,demo-inflight@docker,demo-secure-headers@docker
      - traefik.http.routers.demo-test-fastapi.service=demo-test-fastapi
      - traefik.http.services.demo-test-fastapi.loadbalancer.server.port=8083
      - traefik.docker.network=demo-observability-net
    networks:
      - demo-net

  test-fastify-service:
    build:
      context: ./services/test-fastify
    container_name: demo-test-fastify-service
    environment:
      SERVICE_NAME: test-fastify-service
      SERVICE_PORT: "8084"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-demo}@postgres:5432/${POSTGRES_DB:-demo}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-demo}:${RABBITMQ_PASSWORD:-demo}@rabbitmq:5672/
      RABBITMQ_QUEUE: test.events
    expose:
      - "8084"
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.demo-test-fastify.rule=PathPrefix(`/api/node`)'
      - traefik.http.routers.demo-test-fastify.entrypoints=web
      - traefik.http.routers.demo-test-fastify.middlewares=demo-ratelimit@docker,demo-inflight@docker,demo-secure-headers@docker
      - traefik.http.routers.demo-test-fastify.service=demo-test-fastify
      - traefik.http.services.demo-test-fastify.loadbalancer.server.port=8084
      - traefik.docker.network=demo-observability-net
    networks:
      - demo-net

  postgres:
    image: postgres:17-alpine
    container_name: demo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/script.sql:/docker-entrypoint-initdb.d/script.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - demo-net

  rabbitmq:
    image: rabbitmq:4.1.5-management-alpine
    container_name: demo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-demo}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - demo-net

  redis:
    image: redis:7-alpine
    container_name: demo-redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - demo-net

  otel-collector:
    build:
      context: ./observability
      dockerfile: Dockerfile.otel
    container_name: demo-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo
      - loki
    networks:
      - demo-net

  prometheus:
    build:
      context: ./observability
      dockerfile: prometheus/Dockerfile
    container_name: demo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      traefik:
        condition: service_healthy
      student-service:
        condition: service_healthy
      test-fastapi-service:
        condition: service_healthy
      test-fastify-service:
        condition: service_healthy
      cadvisor:
        condition: service_started
    networks:
      - demo-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: demo-cadvisor
    command:
      - --docker_only=true
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - demo-net

  loki:
    build:
      context: ./observability
      dockerfile: loki/Dockerfile
    container_name: demo-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - demo-net

  tempo:
    build:
      context: ./observability
      dockerfile: tempo/Dockerfile
    container_name: demo-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - demo-net

  grafana:
    build:
      context: ./observability
      dockerfile: grafana/Dockerfile
    container_name: demo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - demo-net

networks:
  demo-net:
    name: demo-observability-net

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
