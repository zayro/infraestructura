global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: student-service
    metrics_path: /metrics
    static_configs:
      - targets: ["student-service:8081"]

  - job_name: test-fastapi-service
    metrics_path: /metrics
    static_configs:
      - targets: ["test-fastapi-service:8083"]

  - job_name: test-fastify-service
    metrics_path: /metrics
    static_configs:
      - targets: ["test-fastify-service:8084"]
