global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: gateway-service
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: student-service
    metrics_path: /metrics
    static_configs:
      - targets: ["student-service:8081"]
